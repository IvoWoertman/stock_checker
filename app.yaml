# Databricks App runtime config.
#
# Attaching a Lakebase database as an app resource makes Databricks inject the
# standard Postgres connection variables (PGHOST, PGPORT, PGDATABASE, PGUSER,
# PGPASSWORD), which psycopg2 reads automatically. No secrets are declared here.
#
# The app must listen on the port Databricks provides (DATABRICKS_APP_PORT),
# defaulting to 8080 for local development.
command:
  - sh
  - -c
  - exec gunicorn -w 2 -b 0.0.0.0:${DATABRICKS_APP_PORT:-8080} app:app
