<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Stock</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Stock</h1>
      <div class="top-actions">
        <span class="status" id="status" title="API connection">…</span>
        <button class="icon-btn" id="scan-btn" title="Scan barcode">📷</button>
        <button class="icon-btn" id="refresh" title="Refresh">↻</button>
      </div>
    </header>

    <main>
      <section class="add-panel">
        <h2>Add stock</h2>
        <form id="add-form" autocomplete="off">
          <label>
            <span>Name</span>
            <input name="name" type="text" placeholder="Ground beef" required />
          </label>
          <div class="row">
            <label>
              <span>Grams</span>
              <input name="qty_g" type="number" inputmode="decimal" min="1" step="1" placeholder="500" required />
            </label>
            <label>
              <span>Location</span>
              <input name="location" type="text" placeholder="Drawer 1" />
            </label>
          </div>
          <label>
            <span>Barcode (optional)</span>
            <div class="code-row">
              <input name="gtin" type="text" inputmode="numeric" placeholder="EAN / GTIN" />
              <button type="button" class="scan-inline" id="scan-inline">Scan</button>
            </div>
          </label>
          <label>
            <span>Shelf life, days (optional)</span>
            <input name="shelf_life_days" type="number" inputmode="numeric" min="1" step="1" placeholder="e.g. 90" />
          </label>
          <button type="submit">Add</button>
        </form>
      </section>

      <section class="inventory">
        <div class="inventory-head">
          <h2>In stock</h2>
        </div>
        <div id="inventory" class="product-list" aria-live="polite"></div>
      </section>
    </main>

    <div class="modal" id="scan-modal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <h2>Scan a barcode</h2>
          <button class="icon-btn" id="scan-close" aria-label="Close">×</button>
        </div>
        <div id="qr-reader"></div>
        <p class="scan-hint" id="scan-status">Point the camera at a package barcode or a label QR.</p>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <script src="/static/vendor/html5-qrcode.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
