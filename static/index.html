<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Stock</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Stock</h1>
      <span class="status" id="status" title="API connection">…</span>
    </header>

    <main>
      <section class="add-panel">
        <h2>Put something in</h2>
        <form id="add-form" autocomplete="off">
          <label>
            <span>Name</span>
            <input name="name" type="text" placeholder="Ground beef" required />
          </label>
          <div class="row">
            <label>
              <span>Grams</span>
              <input name="qty_g" type="number" inputmode="decimal" min="1" step="1" placeholder="500" required />
            </label>
            <label>
              <span>Location</span>
              <input name="location" type="text" placeholder="Drawer 1" />
            </label>
          </div>
          <label>
            <span>Barcode (optional)</span>
            <input name="gtin" type="text" inputmode="numeric" placeholder="EAN / GTIN" />
          </label>
          <button type="submit">Add to stock</button>
        </form>
      </section>

      <section class="inventory">
        <div class="inventory-head">
          <h2>In the stock</h2>
          <button id="refresh" type="button">Refresh</button>
        </div>
        <div id="inventory" class="lot-list" aria-live="polite"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
