<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e17" />
    <title>Stock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7l9-4 9 4-9 4-9-4z" />
            <path d="M3 7v10l9 4 9-4V7" />
            <path d="M12 11v10" />
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Stock</span>
          <span class="brand-sub">freezer · pantry</span>
        </div>
      </div>
      <div class="top-actions">
        <span class="status" id="status" data-state="syncing" title="Connection">·</span>
        <button class="icon-btn" id="scan-btn" title="Scan barcode" aria-label="Scan barcode">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2" />
            <path d="M17 3h2a2 2 0 0 1 2 2v2" />
            <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
            <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
            <path d="M7 12h10" />
          </svg>
        </button>
        <button class="icon-btn" id="refresh" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v6h-6" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="add-panel">
        <h2>Add stock</h2>
        <form id="add-form" autocomplete="off">
          <label>
            <span>Name</span>
            <input name="name" type="text" placeholder="Ground beef" required />
          </label>
          <div class="row">
            <label>
              <span>Grams</span>
              <input name="qty_g" type="number" inputmode="decimal" min="1" step="1" placeholder="500" required />
            </label>
            <label>
              <span>Location</span>
              <input name="location" type="text" placeholder="Drawer 1" />
            </label>
          </div>
          <label>
            <span>Barcode <em>optional</em></span>
            <div class="code-row">
              <input name="gtin" type="text" inputmode="numeric" placeholder="EAN / GTIN" />
              <button type="button" class="scan-inline" id="scan-inline">Scan</button>
            </div>
          </label>
          <div class="row">
            <label>
              <span>Shelf life, days</span>
              <input name="shelf_life_days" type="number" inputmode="numeric" min="1" step="1" placeholder="e.g. 90" />
            </label>
            <label>
              <span>Min stock, g</span>
              <input name="min_stock_g" type="number" inputmode="decimal" min="0" step="1" placeholder="e.g. 500" />
            </label>
          </div>
          <button type="submit">Add to stock</button>
        </form>
      </section>

      <div class="right-col">
        <section class="inventory">
          <div class="inventory-head">
            <h2>In stock</h2>
          </div>
          <div class="filters">
            <input id="search" type="text" placeholder="Search name…" autocomplete="off" />
            <select id="category-filter" aria-label="Filter by category">
              <option value="">All categories</option>
            </select>
          </div>
          <div id="inventory" class="product-list" aria-live="polite"></div>
        </section>

        <section class="inventory">
          <div class="inventory-head">
            <h2>Shopping list</h2>
          </div>
          <form id="shop-form" class="shop-form" autocomplete="off">
            <input name="shop-name" type="text" placeholder="Add to buy…" required />
            <button type="submit">Add</button>
          </form>
          <div id="shopping" class="shop-list" aria-live="polite"></div>
        </section>
      </div>
    </main>

    <div class="modal" id="scan-modal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <h2>Scan a barcode</h2>
          <button class="icon-btn" id="scan-close" aria-label="Close">×</button>
        </div>
        <div id="qr-reader"></div>
        <p class="scan-hint" id="scan-status">Point the camera at a package barcode or a label QR.</p>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <script src="/static/vendor/html5-qrcode.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
